name: 4GL to Python Migration

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'legacy/**/*.4gl'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'legacy/**/*.4gl'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  SOURCE_DIR: 'legacy'
  TARGET_DIR: 'converted'

jobs:
  convert:
    name: Convert 4GL to Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install fglInterpreter
        run: |
          pip install -e .

      - name: Create output directory
        run: |
          mkdir -p ${{ env.TARGET_DIR }}

      - name: Run batch conversion
        id: convert
        run: |
          fgl batch-convert ${{ env.SOURCE_DIR }} ${{ env.TARGET_DIR }} \
            --recursive \
            --resolve-dependencies \
            --sql-backend wbjdbc \
            --report conversion-report.json \
            --report-format json
        continue-on-error: true

      - name: Upload conversion report
        uses: actions/upload-artifact@v4
        with:
          name: conversion-report
          path: conversion-report.json
          retention-days: 30

      - name: Upload converted Python files
        uses: actions/upload-artifact@v4
        with:
          name: converted-python
          path: ${{ env.TARGET_DIR }}/**/*.py
          retention-days: 30

      - name: Check conversion success rate
        run: |
          python << 'EOF'
          import json
          import sys

          with open('conversion-report.json') as f:
              report = json.load(f)

          total = report['summary']['total_files']
          successful = report['summary']['successful']
          success_rate = (successful / total * 100) if total > 0 else 0

          print(f"Conversion Success Rate: {success_rate:.1f}%")
          print(f"Files: {successful}/{total} successful")

          # Configurable threshold (default: 95%)
          threshold = 95.0
          if success_rate < threshold:
              print(f"❌ Conversion success rate ({success_rate:.1f}%) below threshold ({threshold}%)")
              sys.exit(1)
          else:
              print(f"✓ Conversion success rate ({success_rate:.1f}%) meets threshold ({threshold}%)")
          EOF

  validate:
    name: Validate Converted Python
    runs-on: ubuntu-latest
    needs: convert

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install fglInterpreter
        run: |
          pip install -e .

      - name: Download converted Python files
        uses: actions/download-artifact@v4
        with:
          name: converted-python
          path: ${{ env.TARGET_DIR }}

      - name: Run validation
        id: validate
        run: |
          fgl validate-batch ${{ env.SOURCE_DIR }} ${{ env.TARGET_DIR }} \
            --validation-mode normalized \
            --report validation-report.html \
            --report-format html \
            --continue-on-failure
        continue-on-error: true

      - name: Generate JUnit XML report
        run: |
          fgl validate-batch ${{ env.SOURCE_DIR }} ${{ env.TARGET_DIR }} \
            --validation-mode normalized \
            --report validation-junit.xml \
            --report-format junit \
            --continue-on-failure
        continue-on-error: true

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation-report.html
            validation-junit.xml
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: validation-junit.xml
          check_name: Validation Results

      - name: Check validation pass rate
        run: |
          python << 'EOF'
          import xml.etree.ElementTree as ET
          import sys

          tree = ET.parse('validation-junit.xml')
          root = tree.getroot()

          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))

          passed = tests - failures - errors
          pass_rate = (passed / tests * 100) if tests > 0 else 0

          print(f"Validation Pass Rate: {pass_rate:.1f}%")
          print(f"Tests: {passed}/{tests} passed")

          # Configurable threshold (default: 90%)
          threshold = 90.0
          if pass_rate < threshold:
              print(f"❌ Validation pass rate ({pass_rate:.1f}%) below threshold ({threshold}%)")
              sys.exit(1)
          else:
              print(f"✓ Validation pass rate ({pass_rate:.1f}%) meets threshold ({threshold}%)")
          EOF

  report:
    name: Generate Migration Report
    runs-on: ubuntu-latest
    needs: [convert, validate]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install fglInterpreter
        run: |
          pip install -e .

      - name: Download conversion report
        uses: actions/download-artifact@v4
        with:
          name: conversion-report

      - name: Download validation report
        uses: actions/download-artifact@v4
        with:
          name: validation-report
        continue-on-error: true

      - name: Generate comprehensive HTML report
        run: |
          fgl batch-convert ${{ env.SOURCE_DIR }} ${{ env.TARGET_DIR }} \
            --recursive \
            --resolve-dependencies \
            --sql-backend wbjdbc \
            --report migration-report.html \
            --report-format html
        continue-on-error: true

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: migration-report.html
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read conversion report
            let conversionReport;
            try {
              conversionReport = JSON.parse(fs.readFileSync('conversion-report.json', 'utf8'));
            } catch (error) {
              console.log('Could not read conversion report');
              return;
            }

            const summary = conversionReport.summary;
            const successRate = ((summary.successful / summary.total_files) * 100).toFixed(1);
            const readinessScore = conversionReport.migration_readiness_score || 0;

            // Create PR comment
            const comment = `## 4GL → Python Migration Report

            ### Conversion Summary
            - **Total Files**: ${summary.total_files}
            - **Successful**: ${summary.successful} (${successRate}%)
            - **Failed**: ${summary.failed}
            - **Duration**: ${summary.duration.toFixed(2)}s

            ### Migration Readiness
            **Score**: ${readinessScore}/100

            ${readinessScore >= 90 ? '✅ **Ready for Production**' :
              readinessScore >= 70 ? '⚠️ **Mostly Ready** - Minor fixes needed' :
              '❌ **Needs Work** - Significant issues to address'}

            ### Unmapped Constructs
            ${summary.unmapped_constructs_count > 0 ?
              `⚠️ ${summary.unmapped_constructs_count} unmapped construct(s) require manual implementation` :
              '✅ No unmapped constructs'}

            ### Next Steps
            ${conversionReport.recommendations?.map(r => `- ${r}`).join('\n') || 'No recommendations'}

            ---
            📊 [View Full Report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
