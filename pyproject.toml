[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fglinterpreter"
version = "0.1.0"
description = "A Python-based interpreter and tooling framework for Informix 4GL"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Wand", email = "wand@example.com"}
]
keywords = ["4GL", "Informix", "interpreter", "parser", "compiler", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "click>=8.0.0",          # CLI framework
    "rich>=13.0.0",          # Terminal formatting and output
    "pydantic>=2.0.0",       # Data validation and settings
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
database = [
    "wbjdbc>=2.0.0",         # JDBC connector for Informix and other databases
    "wborm>=0.3.2",          # Lightweight ORM for JDBC databases
]
api = [
    "fastapi>=0.100.0",      # Backend API for ReactJS IDE
    "uvicorn>=0.23.0",       # ASGI server
    "websockets>=11.0",      # Real-time communication
    "paramiko>=3.4.0",       # SSH client for terminal
]
ide = [
    "fastapi>=0.100.0",      # Backward-compatible alias for API deps
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "paramiko>=3.4.0",
]
auth = [
    "passlib[bcrypt]>=1.7.4",           # Password hashing
    "python-jose[cryptography]>=3.3.0", # JWT tokens
    "python-multipart>=0.0.6",          # Form data parsing
    "email-validator>=2.0.0",           # Email validation for Pydantic
    "python-ldap>=3.4.3",               # LDAP authentication (optional)
    "python-keycloak>=3.8.0",           # Keycloak integration (optional)
]
all = [
    "fglinterpreter[dev,database,api,auth]",
]

[project.scripts]
fgl = "fglinterpreter.cli:main"
fglconvert = "fglinterpreter.converter.cli:main"

[project.urls]
Homepage = "https://github.com/wanderbatistaf/fglInterpreter"
Documentation = "https://github.com/wanderbatistaf/fglInterpreter/tree/main/docs"
Repository = "https://github.com/wanderbatistaf/fglInterpreter"
"Bug Tracker" = "https://github.com/wanderbatistaf/fglInterpreter/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fglinterpreter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise exceptions with 'from err' (can be added gradually)
    "UP035", # typing.List/Dict deprecation (keeping for Python 3.9 compatibility)
    "UP006", # Use | instead of Union (keeping for Python 3.9 compatibility)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["F401", "F403", "F405", "E402", "B017"]  # Relax test file restrictions
"src/fglinterpreter/interpreter/interpreter.py" = ["F403", "F405"]  # Star imports for AST nodes
"src/fglinterpreter/parser/parser.py" = ["F403", "F405"]  # Star imports for AST nodes
"src/fglinterpreter/database/wborm_adapter.py" = ["F401"]  # Optional wborm import check

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
