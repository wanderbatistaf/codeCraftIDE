<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">CodeCraft IDE - Arquitetura do Sistema</text>

  <!-- Layer 1: Presentation Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="1100" height="100" rx="10" fill="url(#layer1)"/>
    <text x="100" y="115" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">CAMADA DE APRESENTAÇÃO</text>

    <!-- Components -->
    <rect x="80" y="130" width="150" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="155" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Codecraft Studio</text>
    <text x="155" y="168" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(React/Next.js)</text>

    <rect x="250" y="130" width="150" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="325" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Monaco Editor</text>
    <text x="325" y="168" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(4GL/PER/SQL)</text>

    <rect x="420" y="130" width="150" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="495" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Form Preview</text>
    <text x="495" y="168" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(.per / .fm2)</text>

    <rect x="590" y="130" width="150" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="665" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Terminal SSH</text>

    <rect x="760" y="130" width="150" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="835" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">DB Explorer</text>

    <rect x="930" y="130" width="150" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="1005" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">CLI Tools</text>
  </g>

  <!-- Arrow down -->
  <path d="M 600 185 L 600 210 L 590 200 M 600 210 L 610 200" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Layer 2: API Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="220" width="1100" height="100" rx="10" fill="url(#layer2)"/>
    <text x="100" y="255" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">CAMADA DE SERVIÇOS (API)</text>

    <rect x="80" y="270" width="180" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="170" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">FastAPI Backend</text>

    <rect x="280" y="270" width="180" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="370" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">File System API</text>

    <rect x="480" y="270" width="180" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="570" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Database API</text>

    <rect x="680" y="270" width="180" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="770" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">SFTP Service</text>

    <rect x="880" y="270" width="180" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="970" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Auth Service</text>
  </g>

  <!-- Arrow down -->
  <path d="M 600 325 L 600 350 L 590 340 M 600 350 L 610 340" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Layer 3: Core Engine -->
  <g filter="url(#shadow)">
    <rect x="50" y="360" width="1100" height="140" rx="10" fill="url(#layer3)"/>
    <text x="100" y="395" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">NÚCLEO DE PROCESSAMENTO</text>

    <!-- Top row -->
    <rect x="80" y="410" width="160" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="160" y="432" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Lexer (Tokenizer)</text>

    <rect x="260" y="410" width="160" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="340" y="432" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Parser (AST)</text>

    <rect x="440" y="410" width="160" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="520" y="432" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Interpreter</text>

    <rect x="620" y="410" width="160" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="700" y="432" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Converter</text>

    <rect x="800" y="410" width="160" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="880" y="432" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Analyzer</text>

    <rect x="980" y="410" width="160" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="1060" y="432" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Compiler (4make)</text>

    <!-- Bottom row -->
    <rect x="80" y="455" width="220" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="190" y="477" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">PER Parser (Forms)</text>

    <rect x="320" y="455" width="220" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="430" y="477" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">SQL Translator</text>

    <rect x="560" y="455" width="220" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="670" y="477" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Dependency Resolver</text>

    <rect x="800" y="455" width="220" height="35" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="910" y="477" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Validation Framework</text>
  </g>

  <!-- Arrow down -->
  <path d="M 600 505 L 600 530 L 590 520 M 600 530 L 610 520" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Layer 4: Data Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="540" width="1100" height="100" rx="10" fill="url(#layer4)"/>
    <text x="100" y="575" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">CAMADA DE DADOS</text>

    <rect x="80" y="590" width="200" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="180" y="610" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">WBJDBC Adapter</text>
    <text x="180" y="623" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(Informix, PostgreSQL, MySQL)</text>

    <rect x="300" y="590" width="200" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="400" y="610" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">WBORM Adapter</text>
    <text x="400" y="623" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(Object-Relational Mapping)</text>

    <rect x="520" y="590" width="200" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="620" y="610" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">File System</text>
    <text x="620" y="623" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(Local / SFTP)</text>

    <rect x="740" y="590" width="200" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="840" y="610" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Session Storage</text>
    <text x="840" y="623" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(Projects, State)</text>

    <rect x="960" y="590" width="180" height="40" rx="5" fill="white" fill-opacity="0.2"/>
    <text x="1050" y="610" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Auth Store</text>
    <text x="1050" y="623" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9" opacity="0.8">(JWT/LDAP)</text>
  </g>

  <!-- Footer -->
  <text x="600" y="670" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">CodeCraft IDE © 2026 - Arquitetura em Camadas</text>

  <!-- Flow arrows on the side -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Left side labels -->
    <text x="25" y="135" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" transform="rotate(-90, 25, 135)">UI</text>
    <text x="25" y="275" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" transform="rotate(-90, 25, 275)">API</text>
    <text x="25" y="435" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" transform="rotate(-90, 25, 435)">CORE</text>
    <text x="25" y="595" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" transform="rotate(-90, 25, 595)">DATA</text>
  </g>
</svg>